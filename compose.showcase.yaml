name: vitalia-usability
services:
  postgres:
    image: postgres:16.15-bookworm
    env_file: .env.usability
    environment:
      POSTGRES_DB: vitalia_usability
      POSTGRES_USER: vitalia_usability
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U vitalia_usability -d vitalia_usability']
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    image: vitalia-usability-api:local
    build: ./backend
    env_file: .env.usability
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: vitalia_usability
      PGUSER: vitalia_usability
      VITALIA_RUNTIME: container
      VITALIA_SHOWCASE: 'YES'
      VITALIA_SIL_MAIN_MODE: 'YES'
    command: [node, dist/database/showcase.js]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
  web:
    image: nginx:1.28-alpine
    networks: [default, ingress]
    ports:
      - '127.0.0.1:5174:80'
    volumes:
      - ./apps/vitalia/build/usability:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
networks:
  default:
    internal: true
  ingress: {}
volumes:
  postgres_data:
