server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Mantener el control de tamaño de PDF en el backend; esta capa
  # permite las solicitudes documentales hasta el límite de Vitalia.
  client_max_body_size 10m;

  # Única puerta de entrada de Vitalia: web y API bajo el mismo origen.
  # Docker mantiene esta web publicada exclusivamente en 127.0.0.1:5173;
  # Tailscale Serve puede darle HTTPS privado sin exponer la API/PostgreSQL.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    # El navegador llama a Nginx por el MISMO origen; el control CORS
    # estricto del backend protege las llamadas cruzadas directas.
    # No reenviar Origin al salto interno para no exigir que el backend
    # enumere el nombre privado de cada dispositivo Tailscale.
    proxy_set_header Origin "";

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 140s;
  }

  location / { try_files $uri $uri/ /index.html; }
  location = /index.html { add_header Cache-Control "no-store"; }
}
